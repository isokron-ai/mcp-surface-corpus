# Surface corpus: runs IsoKron's MCP checker (engine/core.js, the same file as isokron.ai/mcp-check)
# over the real tool lists of open-source MCP servers, nightly and on dispatch, to calibrate the checker.
#
# It is not a findings channel. Nothing target-specific is public:
#   - the target list is not in the repository in clear text: targets/targets.json.age is decrypted at
#     run time with the CORPUS_TARGETS_KEY secret, inside one step, and the driver deletes the clear
#     text before any target runs;
#   - job and step names are generic; the log and the job summaries carry one "run finished, exit N"
#     line per target, in an order shuffled per run (N is the harness's status, never a verdict);
#   - every raw result (JSON-RPC transcripts, records, logs) is age-encrypted to IsoKron's archive key
#     (recipients.txt) before upload. That key's private half is not in this repository or in CI;
#   - the only public output is the aggregate (counts over servers, cells under 5 withheld, no
#     target id) and the calibration report made from it.
#
# Isolation: every target is untrusted. Its install and its server run in containers of digest-pinned
# images (images.json) under gVisor (runsc, installed and registered by scripts/install-runsc.sh
# exactly as gvisor.json pins it, syscall tracing on), as user 65534, with no capabilities,
# no-new-privileges, a read-only root, memory, pid and CPU limits, and only Docker volumes mounted:
# never the workspace, RUNNER_TEMP, _actions or the Docker socket. Before any target the driver
# checks that the daemon's runsc has exactly those flags and runs a smoke container under it; if
# not, it records a skip and stops: nothing falls back to runc. The install reaches its package
# registry through an allowlist proxy and nothing else; the server runs on an --internal network
# shared with our probe only. On both networks every name resolves to our DNS logger and sinkhole,
# which logs each query and connection attempt, and scripts/net-guard.sh logs and drops anything
# that tries to leave (IPv6 included) and keeps every container away from the runner itself and the
# cloud metadata addresses. The run's telemetry (docs/TELEMETRY.md) is encrypted with the rest of
# the results. No tool is ever called. SECURITY.md has the whole model.
#
# Secrets: one, CORPUS_TARGETS_KEY, in the `corpus` environment only (deployment branches: main). It
# is read by the decrypt step of a shard job and by the aggregate step, and by nothing else; no
# container ever sees it or GITHUB_TOKEN. The plan job has no environment. No pull_request or
# pull_request_target trigger, so no pull request ever runs with the secret. Third-party actions are
# pinned by full SHA. The token has no permission by default; each job asks for contents: read, and
# the aggregate also for actions: read.
#
# Switches: the workflow does nothing until the repository variable SURFACE_CORPUS_ENABLED is 'true'.
# Then the loop guard, the plan job's first step, lets a run go on only while LOOP_ENABLED is 'true'
# and LOOP_SLOTS is a whole number of at least 1, and a run never has more shards than LOOP_SLOTS.

name: corpus

on:
  schedule:
    # Nightly, 07:17 UTC (00:17 in Arizona). A scheduled run takes the whole list.
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: Target ids for this run, comma-separated (e.g. s001,s014), each once; at most 200. Empty runs every target.
        required: false
        default: ''
      shards:
        description: Parallel shard jobs, 1 to 16. Empty for the default (8 for the whole list, one per id up to 16 otherwise).
        required: false
        default: ''

permissions: {}

# One run at a time; a run started while one is going waits. GitHub keeps one waiting run per group.
concurrency:
  group: surface-corpus
  cancel-in-progress: false

jobs:
  # Derives the shard matrix from the inputs alone. No environment, so the key is out of reach; it
  # reads no secret, decrypts nothing and runs no third-party code. The loop guard comes first: unless
  # it says go, nothing else here runs and no shard or aggregate job starts.
  plan:
    if: github.repository == 'isokron-ai/mcp-surface-corpus' && github.ref == 'refs/heads/main' && vars.SURFACE_CORPUS_ENABLED == 'true'
    name: corpus-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.guard.outputs.go }}
      slots: ${{ steps.guard.outputs.slots }}
      shards: ${{ steps.batch.outputs.shards }}
      matrix: ${{ steps.batch.outputs.matrix }}
    steps:
      # The loop guard: the same block in corpus.yml and sandbox-selftest.yml (test/workflows.test.mjs
      # checks that they agree and runs it). It reads two repository variables and nothing else.
      - id: guard
        name: Loop guard
        env:
          EVENT: ${{ github.event_name }}
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_SLOTS: ${{ vars.LOOP_SLOTS }}
        run: |
          # A pull request runs its checks. Any other run goes on only while LOOP_ENABLED is exactly
          # 'true' and LOOP_SLOTS (default 0) is a whole number from 1 to 999; otherwise the job ends
          # here, successfully, with a notice, and the steps and jobs that need it are skipped. The
          # values are never echoed; only go=true|false and slots=N (0 when off) are written.
          go=false
          slots=${LOOP_SLOTS:-0}
          if [ "$EVENT" = pull_request ]; then
            go=true
            slots=1
          elif [ "${LOOP_ENABLED:-}" != true ]; then
            echo "::notice::LOOP_ENABLED is not 'true': this run does nothing"
          elif ! [[ "$slots" =~ ^[0-9]{1,3}$ ]] || [ "$((10#$slots))" -lt 1 ]; then
            echo "::notice::LOOP_SLOTS is not a whole number from 1 to 999: this run does nothing"
          else
            go=true
            slots=$((10#$slots))
          fi
          [ "$go" = true ] || slots=0
          echo "loop guard: go=$go slots=$slots"
          {
            echo "go=$go"
            echo "slots=$slots"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.go == 'true'
        with:
          persist-credentials: false
      - id: batch
        name: Plan the run
        if: steps.guard.outputs.go == 'true'
        env:
          ONLY_IN: ${{ inputs.only }}
          SHARDS_IN: ${{ inputs.shards }}
          # Never more shards than the loop's slots.
          SLOTS_IN: ${{ steps.guard.outputs.slots }}
        run: scripts/check-batch.sh output "$GITHUB_OUTPUT"

  shard:
    needs: plan
    if: needs.plan.outputs.go == 'true' && github.repository == 'isokron-ai/mcp-surface-corpus' && github.ref == 'refs/heads/main' && vars.SURFACE_CORPUS_ENABLED == 'true'
    name: corpus-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # CORPUS_TARGETS_KEY lives only in this environment, whose deployment branches are limited to main.
    environment: corpus
    permissions:
      contents: read
    # GitHub's hosted maximum. The driver gives every target its own time limit (at most 30 minutes).
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the run's inputs
        # The inputs are checked again here, not taken from the plan job; the plan's shard count must
        # match them and the matrix must be exactly that many jobs with this one at its place.
        env:
          ONLY_IN: ${{ inputs.only }}
          SHARDS_IN: ${{ inputs.shards }}
          SLOTS_IN: ${{ needs.plan.outputs.slots }}
          PLAN_SHARDS: ${{ needs.plan.outputs.shards }}
          SHARD: ${{ matrix.shard }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: scripts/check-batch.sh env "$GITHUB_ENV"
      - name: The engine is the vendored one
        run: node scripts/vendor-engine.mjs --verify
      - name: Install age
        run: scripts/install-age.sh
      # Before net-guard.sh: registering runsc restarts the Docker daemon.
      - name: Install gVisor
        run: sudo scripts/install-runsc.sh "$(command -v node)"
      - name: Guard the container networks
        run: sudo scripts/net-guard.sh
      # The sandbox proves itself on this runner before the real list is even decrypted: the hostile
      # self test under the gVisor and firewall just set up, then its telemetry check, which
      # recomputes every verdict and alone decides. A fail stops the job here.
      - name: Self test the sandbox
        run: node bin/sandbox-selftest.mjs --out "$RUNNER_TEMP/selftest" --lane ci || echo "::warning::the harness reported a failure; the telemetry check decides"
      - name: Check the self test
        run: node scripts/check-selftest.mjs "$RUNNER_TEMP/selftest/telemetry.jsonl"
      - name: Decrypt the target list
        env:
          CORPUS_TARGETS_KEY: ${{ secrets.CORPUS_TARGETS_KEY }}
        run: scripts/decrypt-targets.sh
      - id: run
        name: Run the shard
        env:
          SHARD: ${{ matrix.shard }}
          # Read-only token, for the GitHub API's rate limit when reading public repository facts.
          # The driver sends it to api.github.com only; no container gets it.
          GH_TOKEN: ${{ github.token }}
        run: scripts/run-ci-shard.sh
      - id: encrypt
        name: Encrypt the results
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/encrypt-results.sh
      - name: Upload the encrypted results
        if: always() && steps.encrypt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surface-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/corpus-upload/
          if-no-files-found: error
          retention-days: 90
      - name: Job summary
        if: always()
        run: scripts/summary.sh
      - name: Job status
        if: always()
        env:
          RC: ${{ steps.run.outputs.rc }}
        run: |
          [[ "${RC:-}" =~ ^[0-9]{1,3}$ ]] || RC=125
          echo "run finished, exit $RC"
          [ "$RC" = "0" ]

  # Adds the shards up. The rows it reads carry no target name and no text a target wrote; the
  # aggregate it publishes carries counts only (src/aggregate.mjs has the disclosure rules).
  aggregate:
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.go == 'true' && github.repository == 'isokron-ai/mcp-surface-corpus' && github.ref == 'refs/heads/main' && vars.SURFACE_CORPUS_ENABLED == 'true'
    name: corpus-aggregate
    runs-on: ubuntu-24.04
    environment: corpus
    timeout-minutes: 30
    permissions:
      contents: read
      # To read this run's shard artifacts and the previous run's state artifact.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: The engine is the vendored one
        run: node scripts/vendor-engine.mjs --verify
      - name: Install age
        run: scripts/install-age.sh
      - name: Download the shards' encrypted results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: surface-shard-*
          path: ${{ runner.temp }}/shards
      - name: Find the previous run's state
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-prev-state.sh
      - name: Aggregate
        env:
          CORPUS_TARGETS_KEY: ${{ secrets.CORPUS_TARGETS_KEY }}
          ONLY_IN: ${{ inputs.only }}
        run: scripts/aggregate-ci.sh
      - name: Upload the public aggregate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surface-aggregate
          path: ${{ runner.temp }}/aggregate-public/
          if-no-files-found: error
          retention-days: 90
      - name: Upload the encrypted exact aggregate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surface-aggregate-private
          path: ${{ runner.temp }}/aggregate-private/
          if-no-files-found: error
          retention-days: 90
      - name: Upload the encrypted state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surface-state
          path: ${{ runner.temp }}/aggregate-state/
          if-no-files-found: error
          retention-days: 90
      - name: Job summary
        run: cat "$RUNNER_TEMP/aggregate-public/calibration.md" >> "$GITHUB_STEP_SUMMARY"
