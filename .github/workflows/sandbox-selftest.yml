# Sandbox self test: runs selftest/hostile.py in the real sandbox, once per escape attempt (direct IP,
# DNS over HTTPS by IP, raw socket, IPv6, ICMP, the Docker host, cloud metadata, a token in the
# environment, a write outside the work volume, a fork bomb, forged output), and passes only when the
# harness's own evidence shows every attempt was blocked and logged (bin/sandbox-selftest.mjs,
# src/selftest.mjs). The sandbox is the one every corpus target gets: gVisor (runsc) installed and
# registered exactly as gvisor.json pins it, user 65534, no capabilities, a read-only root, limits, the
# run network with our DNS logger and sinkhole, and net-guard.sh's log-and-drop firewall on the host.
# If any of that is missing the run records a skip and fails: nothing falls back to runc.
#
# Then scripts/check-selftest.mjs reads the telemetry alone (docs/TELEMETRY.md) and fails unless each
# case has exactly one bypass_result that is blocked, logged and passing, with a runsc container
# record and a syscall trace summary. The telemetry and results.json are uploaded; what the hostile
# target printed (untrusted/) is not.
#
# Triggers: by hand, and on pull requests that touch the sandbox or anything the self test imports
# (test/workflows.test.mjs checks the paths against the imports). No secret, no environment, a token
# with no permission but contents: read for the checkout, no pull_request_target. The loop guard runs
# first, alone, with no checkout: a pull request always goes on; a run by hand goes on only while the
# repository variables LOOP_ENABLED is 'true' and LOOP_SLOTS is at least 1.

name: sandbox-selftest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sandbox-selftest.yml
      - bin/sandbox-selftest.mjs
      - bin/run-shard.mjs
      - sandbox/**
      - selftest/**
      - src/dns.mjs
      - src/docker.mjs
      - src/env-refs.mjs
      - src/record.mjs
      - src/runsc.mjs
      - src/sandbox-*.mjs
      - src/sdk.mjs
      - src/selftest.mjs
      - src/sources.mjs
      - src/targets.mjs
      - src/telemetry.mjs
      - src/trace-summary.mjs
      - scripts/install-runsc.sh
      - scripts/runsc-plan.mjs
      - scripts/net-guard.sh
      - scripts/check-selftest.mjs
      - gvisor.json
      - images.json

permissions: {}

concurrency:
  group: sandbox-selftest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No checkout, no action, no permission: the guard alone.
  gate:
    name: selftest-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      go: ${{ steps.guard.outputs.go }}
      slots: ${{ steps.guard.outputs.slots }}
    steps:
      # The loop guard: the same block in corpus.yml and sandbox-selftest.yml (test/workflows.test.mjs
      # checks that they agree and runs it). It reads two repository variables and nothing else.
      - id: guard
        name: Loop guard
        env:
          EVENT: ${{ github.event_name }}
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_SLOTS: ${{ vars.LOOP_SLOTS }}
        run: |
          # A pull request runs its checks. Any other run goes on only while LOOP_ENABLED is exactly
          # 'true' and LOOP_SLOTS (default 0) is a whole number from 1 to 999; otherwise the job ends
          # here, successfully, with a notice, and the steps and jobs that need it are skipped. The
          # values are never echoed; only go=true|false and slots=N (0 when off) are written.
          go=false
          slots=${LOOP_SLOTS:-0}
          if [ "$EVENT" = pull_request ]; then
            go=true
            slots=1
          elif [ "${LOOP_ENABLED:-}" != true ]; then
            echo "::notice::LOOP_ENABLED is not 'true': this run does nothing"
          elif ! [[ "$slots" =~ ^[0-9]{1,3}$ ]] || [ "$((10#$slots))" -lt 1 ]; then
            echo "::notice::LOOP_SLOTS is not a whole number from 1 to 999: this run does nothing"
          else
            go=true
            slots=$((10#$slots))
          fi
          [ "$go" = true ] || slots=0
          echo "loop guard: go=$go slots=$slots"
          {
            echo "go=$go"
            echo "slots=$slots"
          } >>"$GITHUB_OUTPUT"

  selftest:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    name: sandbox-selftest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Eleven cases of at most two minutes each (CASE_MS), plus the gVisor install and image pulls.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # Before net-guard.sh: registering runsc restarts the Docker daemon.
      - name: Install gVisor
        run: sudo scripts/install-runsc.sh "$(command -v node)"
      - name: Guard the container networks
        run: sudo scripts/net-guard.sh
      - name: Run the self test
        run: node bin/sandbox-selftest.mjs --out "$RUNNER_TEMP/selftest" --lane ci
      - name: Check the telemetry
        run: node scripts/check-selftest.mjs "$RUNNER_TEMP/selftest/telemetry.jsonl"
      - name: Upload the telemetry and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-selftest
          path: |
            ${{ runner.temp }}/selftest/telemetry.jsonl
            ${{ runner.temp }}/selftest/results.json
          if-no-files-found: warn
          retention-days: 14
