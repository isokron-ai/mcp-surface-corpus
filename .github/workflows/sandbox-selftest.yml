# Sandbox self test, on pull requests that touch the sandbox and by hand. It calls the reusable
# workflow sandbox-conformance.yml of this same commit with mutations on:
#
#   - the hostile self test: selftest/hostile.py in the real sandbox, once per escape attempt (direct
#     IP, DNS over HTTPS by IP, raw socket, IPv6, ICMP, the Docker host, cloud metadata, a token in
#     the environment, a write outside the work volume, a fork bomb, forged output), passing only
#     when scripts/check-selftest.mjs recomputes every case as blocked and logged from the telemetry
#     alone (docs/TELEMETRY.md). The sandbox is the one every corpus target gets: gVisor (runsc)
#     installed and registered exactly as gvisor.json pins it, user 65534, no capabilities, a
#     read-only root, limits, the run network with our DNS logger and sinkhole, and net-guard.sh's
#     log-and-drop firewall on the host. If any of that is missing the run records a skip and fails:
#     nothing falls back to runc;
#   - the mutation matrix: each protection off in turn, and the self test must fail for that reason.
#
# The telemetry and results.json are uploaded; what the hostile target printed (untrusted/) is not.
# The same self test and mutations also run every night, whatever the loop's switches say
# (conformance-nightly.yml), and publish a status file tool-qa reads.
#
# Triggers: by hand, and on pull requests that touch the sandbox or anything the self test imports
# (test/workflows.test.mjs checks the paths against the imports). No secret, no environment, a token
# with no permission but contents: read for the checkout, no pull_request_target. The loop guard runs
# first, alone, with no checkout: a pull request always goes on; a run by hand goes on only while the
# repository variables LOOP_ENABLED is 'true' and LOOP_SLOTS is at least 1.

name: sandbox-selftest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sandbox-selftest.yml
      - .github/workflows/sandbox-conformance.yml
      - sandbox-guard/**
      - bin/sandbox-selftest.mjs
      - bin/run-shard.mjs
      - sandbox/**
      - selftest/**
      - src/dns.mjs
      - src/docker.mjs
      - src/env-refs.mjs
      - src/record.mjs
      - src/runsc.mjs
      - src/sandbox-*.mjs
      - src/sdk.mjs
      - src/selftest.mjs
      - src/sources.mjs
      - src/targets.mjs
      - src/telemetry.mjs
      - src/trace-summary.mjs
      - scripts/install-runsc.sh
      - scripts/runsc-plan.mjs
      - scripts/net-guard.sh
      - scripts/check-selftest.mjs
      - scripts/check-mutation.mjs
      - scripts/runner-facts.mjs
      - gvisor.json
      - images.json

permissions: {}

concurrency:
  group: sandbox-selftest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No checkout, no action, no permission: the guard alone.
  gate:
    name: selftest-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      go: ${{ steps.guard.outputs.go }}
      slots: ${{ steps.guard.outputs.slots }}
    steps:
      # The loop guard: the same block in corpus.yml and sandbox-selftest.yml (test/workflows.test.mjs
      # checks that they agree and runs it). It reads two repository variables and nothing else.
      - id: guard
        name: Loop guard
        env:
          EVENT: ${{ github.event_name }}
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_SLOTS: ${{ vars.LOOP_SLOTS }}
        run: |
          # A pull request runs its checks. Any other run goes on only while LOOP_ENABLED is exactly
          # 'true' and LOOP_SLOTS (default 0) is a whole number from 1 to 999; otherwise the job ends
          # here, successfully, with a notice, and the steps and jobs that need it are skipped. The
          # values are never echoed; only go=true|false and slots=N (0 when off) are written.
          go=false
          slots=${LOOP_SLOTS:-0}
          if [ "$EVENT" = pull_request ]; then
            go=true
            slots=1
          elif [ "${LOOP_ENABLED:-}" != true ]; then
            echo "::notice::LOOP_ENABLED is not 'true': this run does nothing"
          elif ! [[ "$slots" =~ ^[0-9]{1,3}$ ]] || [ "$((10#$slots))" -lt 1 ]; then
            echo "::notice::LOOP_SLOTS is not a whole number from 1 to 999: this run does nothing"
          else
            go=true
            slots=$((10#$slots))
          fi
          [ "$go" = true ] || slots=0
          echo "loop guard: go=$go slots=$slots"
          {
            echo "go=$go"
            echo "slots=$slots"
          } >>"$GITHUB_OUTPUT"

  # The self test and the mutation matrix, from the reusable workflow of this same commit.
  conformance:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/sandbox-conformance.yml
    with:
      mutations: true
      artifact-prefix: sandbox
